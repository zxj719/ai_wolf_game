<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img"
     aria-label="ament_python 包目录结构说明图">
  <style>
    .pkg-t { font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: currentColor; }
    .pkg-n { font-family: system-ui, sans-serif; font-size: 12.5px; fill: currentColor; opacity: .75; }
    .pkg-k { font-weight: 700; }
    .pkg-line { stroke: currentColor; stroke-opacity: .35; stroke-width: 1; }
    .pkg-arrow { stroke: currentColor; stroke-opacity: .45; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <text class="pkg-t pkg-k" x="10" y="24">my_robot/</text>
  <text class="pkg-n" x="330" y="24">← 包目录</text>

  <text class="pkg-t" x="34" y="52">├── package.xml</text>
  <text class="pkg-n" x="330" y="52">包名、依赖、构建类型</text>
  <line class="pkg-arrow" x1="200" y1="47" x2="325" y2="47"/>

  <text class="pkg-t" x="34" y="80">├── setup.py</text>
  <text class="pkg-n" x="330" y="80">可执行入口、要安装什么</text>
  <line class="pkg-arrow" x1="200" y1="75" x2="325" y2="75"/>

  <text class="pkg-t" x="34" y="108">├── setup.cfg</text>
  <text class="pkg-n" x="330" y="108">告诉 colcon 可执行装到哪</text>
  <line class="pkg-arrow" x1="200" y1="103" x2="325" y2="103"/>

  <text class="pkg-t" x="34" y="136">├── resource/</text>
  <text class="pkg-t" x="66" y="160">│   └── my_robot</text>
  <text class="pkg-n" x="330" y="148">空文件，让 ament 索引到这个包</text>
  <line class="pkg-arrow" x1="230" y1="155" x2="325" y2="148"/>

  <text class="pkg-t pkg-k" x="34" y="192">└── my_robot/</text>
  <text class="pkg-n" x="330" y="192">Python 包，名字必须等于包名</text>
  <line class="pkg-arrow" x1="200" y1="187" x2="325" y2="187"/>

  <text class="pkg-t" x="66" y="220">├── __init__.py</text>
  <text class="pkg-n" x="330" y="220">空文件，标记这是 Python 包</text>
  <line class="pkg-arrow" x1="220" y1="215" x2="325" y2="215"/>

  <text class="pkg-t" x="66" y="248">├── talker.py</text>
  <text class="pkg-n" x="330" y="248">你的节点代码（第三节写）</text>
  <line class="pkg-arrow" x1="220" y1="243" x2="325" y2="243"/>

  <text class="pkg-t" x="66" y="276">└── listener.py</text>

  <line class="pkg-line" x1="10" y1="298" x2="610" y2="298"/>
  <text class="pkg-n" x="10" y="320">目录名 my_robot 与 package.xml 里的 name、setup.py 里的 package_name 三者必须一致，</text>
  <text class="pkg-n" x="10" y="336">否则 import 时报 ModuleNotFoundError。</text>
</svg>
